<style>
  @import url('https://fonts.googleapis.com/css2?family=Varela+Round&display=swap');
  @import url('https://fonts.googleapis.com/css2?family=Bonheur+Royale&display=swap');

  /* Reseteo básico y tipografía */
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  body {
    font-family: "Roboto", sans-serif;
  background: #000000;
background: -webkit-linear-gradient(111deg, rgba(0, 0, 0, 1) 68%, rgba(46, 46, 46, 1) 100%);
background: -moz-linear-gradient(111deg, rgba(0, 0, 0, 1) 68%, rgba(46, 46, 46, 1) 100%);
background: linear-gradient(111deg, rgba(0, 0, 0, 1) 68%, rgba(46, 46, 46, 1) 100%);
filter: progid:DXImageTransform.Microsoft.gradient(startColorstr="#000000", endColorstr="#2E2E2E", GradientType=0);
    color: #fff;
   
  }
  .bonheur-royale-regular {
font-family: "Bonheur Royale", cursive;
font-weight: 400;
font-style: normal;
}

  .varela-round-regular {
font-family: "Varela Round", sans-serif;
font-weight: 400;
font-style: normal;
}
  .roboto-body {
font-family: "Roboto", sans-serif;
font-optical-sizing: auto;
font-weight: 100;
font-style: normal;
font-variation-settings:
  "wdth" 100;
  
}
a:hover {
color:white;
animation-name:glow;
animation-duration:1s;
animation-iteration-count:infinite;
animation-direction:alternate;
}
@keyframes glow{
from{text-shadow:0px 0px 5px #fff,0px 0px 5px #ffe100;}
to{text-shadow:0px 0px 20px #fff,0px 0px 20px #ffe100;}
}
a:link{
text-decoration:none
}
a:visited{
text-decoration:none
}
.center {
  display: block;
  margin-left: auto;
  margin-right: auto;
  width: 75%;
  padding:1px
}
  /* --- BARRA DE NAVEGACIÓN --- */
  header {
    background-color: #1a1a1a;
    position: sticky;
    top: 0;
    z-index: 1000;
    box-shadow: 0 2px 12px rgba(0, 0, 0, 0.5);
  }
  nav {
    max-width: 1200px;
    margin: 0 auto;
    padding: 1rem 2rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .logo {
    font-family: "Bonheur Royale", cursive;
    font-size: 1.8rem;
    font-weight: 400;
    color: #fff;
    text-decoration: none;

  }
  
  img {
margin-bottom: -9px;
margin-right:5px;
}

  .nav-links {
    display: flex;
    list-style: none;
    gap: 2rem;
  }
  .nav-links a {
    color: #dddddd;
    text-decoration: none;
    font-weight: 500;
    transition: color 0.3s ease;
  }
  .nav-links a:hover, .nav-links a.active-link {
    color: #ffffff;
  }

  /* --- CONTENEDOR PRINCIPAL --- */
  .main-container {
    max-width: 1200px;
    margin: 2rem auto;
    padding: 0 1.5rem;
  }
  .section-title {
    text-align: center;
    margin-bottom: 1rem;
    font-weight: 500;
    letter-spacing: 1px;
    position: relative;
    
  }
  .section-title::after {
    content: '';
    display: block;
    width: 50px;
    height: 2px;
    margin: 8px auto 0;
  }

  /* --- VISOR PRINCIPAL Y THUMBNAILS --- */
  .hero-viewer-section {
    margin-bottom: 4rem;
  }
  
  /* Imagen Estática / Destacada Principal */
  .featured-display {
    position: relative;
    width: 100%;
    height: 100%;
    background-color: #0a0a0a;
  }
  .featured-display img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  
  }
  .featured-caption {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    background: linear-gradient(transparent, rgba(0,0,0,0.85));
    color: #fff;
    padding: 2.5rem 1.5rem 1rem;
    font-size: 1.2rem;
    letter-spacing: 0.5px;
  }
 
  /* Carrusel Deslizable de Miniaturas (Thumbnails) */
  .thumb-carousel-container {
    position: relative;
    margin-top: 1.5rem;
    display: flex;
    align-items: center;
  }
  .thumb-track {
    display: flex;
    gap: 12px;
    overflow-x: auto;
    scroll-behavior: smooth;
    padding: 10px 2px;
    width: 100%;
  }
  .thumb-track::-webkit-scrollbar {
    height: 6px;
  }
  .thumb-track::-webkit-scrollbar-track {
    background: #1a1a1a;
    border-radius: 4px;
  }
  .thumb-track::-webkit-scrollbar-thumb {
    background: #fff;
    border-radius: 4px;
  }

  .thumb-item {
    flex: 0 0 140px;
    height: 95px;
    border-radius: 8px;
    overflow: hidden;
    cursor: pointer;
    opacity: 0.7;
    border: 2px solid transparent;
    transition: all 0.3s ease;
  }
  .thumb-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .thumb-item:hover {
    opacity: 0.85;
  }
  .thumb-item.active-thumb {
    opacity: 1;
    border-color: #fff;
    transform: scale(1.03);
  }

  /* Botones de desplazamiento de miniaturas */
  .thumb-nav-btn {
    background: rgba(26, 26, 26, 0.8);
    color: #fff;
    border: 1px solid #333;
    font-size: 1.2rem;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
    transition: background 0.3s ease;
    flex-shrink: 0;
  }
  .thumb-nav-btn:hover {
    background: #fff;
    color: #333;
    border-color: #333;
  }
  .thumb-nav-left { margin-right: 10px; }
  .thumb-nav-right { margin-left: 10px; }

  /* --- FILTROS DE CATEGORÍA --- */
  .filter-container {
    display: flex;
    justify-content: center;
    gap: 0.5rem;
    margin-bottom: 2.5rem;
    flex-wrap: wrap;
  }
  .filter-btn {
    background: #1a1a1a;
    color: #aaa;
    border: 1px solid #333;
    padding: 0.6rem 1.4rem;
    border-radius: 25px;
    font-size: 0.95rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.3s ease;
  }
  .filter-btn:hover, .filter-btn.active-filter {
    background: #fff;
    color: #1a1a1a;
    border-color: #333;
    box-shadow: 0 4px 12px rgba(230, 57, 70, 0.3);
  }

 /* Grilla para centrar los 4 videos */
.video-grid {
  display: grid;
  
  max-width: 75%;
  margin: 0 auto; /* Centra la grilla en la página */
  padding: 20px;
}

/* Ajuste proporcional para eliminar espacios en blanco */
.video-item iframe {
  width: 100%;
  height: 100%;
  aspect-ratio: 16 / 9; /* Mantiene la proporción clásica de video HD */

  display: block;
}

  
  .center {
  display: block;
  margin-left: auto;
  margin-right: auto;
  width: 75%;

}
  /* --- DISEÑO ADAPTATIVO (MÓVILES) --- */
  @media (max-width: 768px) {
    nav { flex-direction: column; gap: 1rem; }
    .featured-display { height: 320px; }
    .nav-links { gap: 1rem; }

  }
</style>
