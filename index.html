  <style>
    @import url('https://fonts.googleapis.com/css2?family=Varela+Round&display=swap');
    @import url('https://fonts.googleapis.com/css2?family=Bonheur+Royale&display=swap');

    /* --- RESETEO BÁSICO --- */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: "Roboto", sans-serif;
      background: #000000;
      background: linear-gradient(111deg, rgba(0, 0, 0, 1) 68%, rgba(46, 46, 46, 1) 100%);
      color: #fff;
    }

    /* --- TIPOGRAFÍA Y ENLACES --- */
    .bonheur-royale-regular { font-family: "Bonheur Royale", cursive; }
    .varela-round-regular { font-family: "Varela Round", sans-serif; }
    
    a:link, a:visited { text-decoration: none; color: inherit; }
    
    a:hover {
      color: white;
      animation: glow 1s infinite alternate;
    }
    @keyframes glow {
      from { text-shadow: 0px 0px 5px #fff, 0px 0px 5px #ffe100; }
      to { text-shadow: 0px 0px 20px #fff, 0px 0px 20px #ffe100; }
    }

    /* --- BARRA DE NAVEGACIÓN --- */
    header {
      background-color: #1a1a1a;
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.5);
    }
    nav {
      max-width: 1200px;
      margin: 0 auto;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo {
      font-family: "Bonheur Royale", cursive;
      font-size: 1.8rem;
      display: flex;
      align-items: center;
    }
    .logo img {
      width: 35px;
      border-radius: 20px;
      margin-right: 10px;
    }
    .nav-links {
      display: flex;
      list-style: none;
      gap: 2rem;
    }
    .nav-links a {
      color: #dddddd;
      font-weight: 500;
      transition: color 0.3s ease;
    }
    .nav-links a:hover { color: #ffffff; }

    /* --- TÍTULO SECCIÓN --- */
    .portfolio-title {
      text-align: center;
      margin: 4rem 0 3rem 0; /* Espaciado arriba y abajo */
    }
    .portfolio-title h1 {
      font-weight: 500;
      letter-spacing: 1px;
    }

    /* ========================================= */
    /* --- SOLUCIÓN B: GRILLA CON MARCO BLANCO --- */
    /* ========================================= */
    
    .row {
      max-width: 100%; /* Ancho máximo de la grilla */
      margin: 0 auto;     /* Centrar la grilla en la página */
      padding: 5px;       /* Espacio entre el borde exterior y las fotos */
      
      /* 1. Convertimos el contenedor en un Grid */
      display: grid;
      
      /* 2. Creamos 4 columnas de igual ancho (estático) */
      grid-template-columns: repeat(4, 1fr);
      
      /* 3. Definimos el grosor de las líneas blancas (el espacio entre fotos) */
      gap: 8px; 
      
      /* 4. El "Truco": Fondo blanco que se ve a través del gap */
      background-color: white;
      
      /* Opcional: un borde exterior fino para cerrar el marco */
      border: 1px solid white; 
    }

    /* Ajuste para las columnas antiguas (ya no necesitan flex) */
    .column {
      display: flex;
      flex-direction: column;
      gap: 8px; /* Espacio vertical entre fotos dentro de la misma columna */
    }

    /* Asegurar que las imágenes llenen su espacio */
    .column img {
      width: 100%;
      height: auto;
      display: block; /* Quita espacio extra debajo de las imágenes */
    }

    /* --- DISEÑO ADAPTATIVO (MÓVILES) --- */
    @media (max-width: 768px) {
      nav { flex-direction: column; gap: 1rem; }
      .nav-links { gap: 1rem; }
      
      /* En móviles, cambiamos a 2 columnas para que no se vean tan pequeñas */
      .row {
        grid-template-columns: repeat(1, 1fr);
        padding: 4px;
        gap: 4px;
      }
      .column { gap: 4px; }
    }
    /* Asegurar que las imágenes llenen su espacio y carguen suavemente */
    .column img {
      width: 100%;
      height: auto;
      display: block;
      background-color: #1a1a1a; /* Color de reserva mientras carga */
      transition: opacity 0.4s ease-in-out;
    }

    /* Evita saltos de maquetación reservando espacio de aspecto aproximado */
    .column img:not([src]) {
      visibility: hidden;
    }
  </style>

 <!-- Photo Grid con Marco Blanco -->

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // Detecta las imágenes dentro del primer pantallazo (above the fold) y quita el lazy loading para darles prioridad
      const firstRowImages = document.querySelectorAll('.column img:nth-child(-n+2)');
      firstRowImages.forEach(img => {
        img.removeAttribute('loading');
        img.setAttribute('fetchpriority', 'high');
      });
    });
  </script>
