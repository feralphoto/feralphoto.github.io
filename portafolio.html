    @import url('https://fonts.googleapis.com/css2?family=Varela+Round&display=swap');

filter: progid:DXImageTransform.Microsoft.gradient(startColorstr="#000000", endColorstr="#2E2E2E", GradientType=0);
      color: #fff;
     
    }

  font-family: "Bonheur Royale", cursive;
  font-weight: 400;
  font-style: normal;
}

    .varela-round-regular {
  font-family: "Varela Round", sans-serif;
  font-weight: 400;
  font-style: normal;
}

  font-family: "Roboto", sans-serif;

}

}

    /* --- BARRA DE NAVEGACIÓN --- */
    header {
      background-color: #1a1a1a;
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.5);
    }
    nav {
      max-width: 1200px;
      margin: 0 auto;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo {
      font-family: "Bonheur Royale", cursive;
      font-size: 1.8rem;
      font-weight: 500;
      color: #fff;
      text-decoration: none;
  
    }
    
    img {
  margin-bottom: -9px;
  margin-right:5px;
}

    .nav-links {
      display: flex;
      list-style: none;
      gap: 2rem;
    }
    .nav-links a {
      color: #dddddd;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.3s ease;
    }
    .nav-links a:hover, .nav-links a.active-link {
      color: #ffffff;
    }

    /* --- CONTENEDOR PRINCIPAL --- */
    .main-container {
      max-width: 1200px;
      margin: 2rem auto;
      padding: 0 1.5rem;
    }
    .section-title {
      text-align: center;
      margin-bottom: 1rem;
      font-weight: 500;
      letter-spacing: 1px;
      position: relative;
      
    }
    .section-title::after {
      content: '';
      display: block;
      width: 50px;
      height: 2px;
      margin: 8px auto 0;
    }

    /* --- VISOR PRINCIPAL Y THUMBNAILS --- */
    .hero-viewer-section {
      margin-bottom: 4rem;
    }
    
    /* Imagen Estática / Destacada Principal */
    .featured-display {
      position: relative;
      width: 100%;
      height: 100%;
      background-color: #0a0a0a;
    }
    .featured-display img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    
    }
    .featured-caption {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(transparent, rgba(0,0,0,0.85));
      color: #fff;
      padding: 2.5rem 1.5rem 1rem;
      font-size: 1.2rem;
      letter-spacing: 0.5px;
    }
   
    /* Carrusel Deslizable de Miniaturas (Thumbnails) */
    .thumb-carousel-container {
      position: relative;
      margin-top: 1.5rem;
      display: flex;
      align-items: center;
    }
    .thumb-track {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      scroll-behavior: smooth;
      padding: 10px 2px;
      width: 100%;
    }
    .thumb-track::-webkit-scrollbar {
      height: 6px;
    }
    .thumb-track::-webkit-scrollbar-track {
      background: #1a1a1a;
      border-radius: 4px;
    }
    .thumb-track::-webkit-scrollbar-thumb {
      background: #fff;
      border-radius: 4px;
    }

    .thumb-item {
      flex: 0 0 140px;
      height: 95px;
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      opacity: 0.7;
      border: 2px solid transparent;
      transition: all 0.3s ease;
    }
    .thumb-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .thumb-item:hover {
      opacity: 0.85;
    }
    .thumb-item.active-thumb {
      opacity: 1;
      border-color: #fff;
      transform: scale(1.03);
    }

    /* Botones de desplazamiento de miniaturas */
    .thumb-nav-btn {
      background: rgba(26, 26, 26, 0.8);
      color: #fff;
      border: 1px solid #333;
      font-size: 1.2rem;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      transition: background 0.3s ease;
      flex-shrink: 0;
    }
    .thumb-nav-btn:hover {
      background: #fff;
      color: #333;
      border-color: #333;
    }
    .thumb-nav-left { margin-right: 10px; }
    .thumb-nav-right { margin-left: 10px; }

    /* --- FILTROS DE CATEGORÍA --- */
    .filter-container {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      margin-bottom: 2.5rem;
      flex-wrap: wrap;
    }
    .filter-btn {
      background: #1a1a1a;
      color: #aaa;
      border: 1px solid #333;
      padding: 0.6rem 1.4rem;
      border-radius: 25px;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .filter-btn:hover, .filter-btn.active-filter {
      background: #fff;
      color: #1a1a1a;
      border-color: #333;
      box-shadow: 0 4px 12px rgba(230, 57, 70, 0.3);
    }



    /* --- LIGHTBOX MODAL --- */
    .lightbox {
      display: none;
      position: fixed;
      z-index: 2000;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.92);
      backdrop-filter: blur(5px);
      justify-content: center;
      align-items: center;
      flex-direction: column;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .lightbox.show {
      display: flex;
      opacity: 1;
    }
    .lightbox-content {
      max-width: 90%;
      max-height: 80vh;
      object-fit: contain;
      border-radius: 6px;
      transform: scale(0.95);
      transition: transform 0.3s ease;
    }
    .lightbox.show .lightbox-content {
      transform: scale(1);
    }
    .lightbox-caption {
      margin-top: 1.5rem;
      color: #ddd;
      font-size: 1.1rem;
      text-align: center;
      letter-spacing: 0.5px;
    }
    .lightbox-close {
      position: absolute;
      top: 25px;
      right: 35px;
      color: #fff;
      font-size: 40px;
      font-weight: bold;
      cursor: pointer;
      transition: color 0.2s ease;
      line-height: 1;
    }
    .lightbox-close:hover {
      color: #fff;
    }
    .lightbox-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      color: #fff;
      font-size: 30px;
      cursor: pointer;
      padding: 15px;
      user-select: none;
      background: rgba(255,255,255,0.05);
      border-radius: 50%;
      transition: background 0.3s ease;
    }
    .lightbox-nav:hover {
      background: rgba(255,255,255,0.2);
    }
    .lightbox-prev { left: 25px; }
    .lightbox-next { right: 25px; }
     /* Botones Anterior / Siguiente */
     .prev, .next {
      cursor: pointer;
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      padding: 12px 18px;
      color: #fff;
      font-size: 20px;
      font-weight: bold;
      transition: background-color 0.3s ease;
      background-color: rgba(0, 0, 0, 0.4);
      border: none;
      border-radius: 50%;
      user-select: none;
    }
    .prev { left: 15px; }
    .next { right: 15px; }
    .prev:hover, .next:hover {
      background-color: rgba(0, 0, 0, 0.8);
    }

    /* --- DISEÑO ADAPTATIVO (MÓVILES) --- */
    @media (max-width: 768px) {
      nav { flex-direction: column; gap: 1rem; }
      .featured-display { height: 320px; }
      .nav-links { gap: 1rem; }
      .photo-grid {
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 1rem;
      }
      .thumb-item { flex: 0 0 100px; height: 70px; }
      .lightbox-close { top: 15px; right: 20px; font-size: 30px; }
      .lightbox-nav { font-size: 20px; padding: 10px; }
      .lightbox-prev { left: 10px; }
      .lightbox-next { right: 10px; }
    }
  </style>
</head>

  <script src="js/script.js"></script>
  <script>
    let currentCategory = 'todas';
    let filteredPhotos = [];
    let selectedPhotoIndex = 0;
  
    // Elementos del DOM
    const mainFeaturedImg = document.getElementById('mainFeaturedImg');
    const thumbTrack = document.getElementById('thumbTrack');
  
    /* ====================================
       INICIALIZACIÓN Y RENDER DE MINIATURAS
    ==================================== */
    function initViewer() {
      if (typeof allPhotos === 'undefined') {
        console.error("No se pudo cargar la variable 'allPhotos'. Revisa js/script.js");
        return;
      }
      filteredPhotos = [...allPhotos];
      renderThumbnails();
      selectFeaturedPhoto(0);
    }
  
    function renderThumbnails() {
      thumbTrack.innerHTML = '';
      filteredPhotos.forEach((photo, index) => {
        const thumbDiv = document.createElement('div');
        thumbDiv.className = `thumb-item ${index === selectedPhotoIndex ? 'active-thumb' : ''}`;
        thumbDiv.onclick = () => selectFeaturedPhoto(index);

        const img = document.createElement('img');
        img.src = photo.thumbSrc || photo.src;
        img.alt = photo.title || 'Fotografía';
        
        // --- OPTIMIZACIÓN DE CARGA RAPIDA ---
        img.loading = 'lazy';   // Solo descarga la miniatura cuando aparece en el scroll horizontal
        img.decoding = 'async'; // Procesa la imagen sin bloquear la interfaz

        thumbDiv.appendChild(img);
        thumbTrack.appendChild(thumbDiv);
      });
    }
  
    function selectFeaturedPhoto(index) {
      if (filteredPhotos.length === 0) return;
      
      if (index >= filteredPhotos.length) index = 0;
      if (index < 0) index = filteredPhotos.length - 1;

      selectedPhotoIndex = index;
      const photo = filteredPhotos[selectedPhotoIndex];

      mainFeaturedImg.style.opacity = '0.3';
      setTimeout(() => {
        mainFeaturedImg.src = photo.src;
        mainFeaturedImg.style.opacity = '1';
      }, 150);

      const thumbs = thumbTrack.getElementsByClassName('thumb-item');
      Array.from(thumbs).forEach((thumb, idx) => {
        if (idx === selectedPhotoIndex) {
          thumb.classList.add('active-thumb');
          thumb.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
        } else {
          thumb.classList.remove('active-thumb');
        }
      });

      // --- PRECARGA DE LA SIGUIENTE Y ANTERIOR FOTO ---
      preloadNextImages(index);
    }

    // Nueva función auxiliar para precargar en segundo plano
    function preloadNextImages(currentIndex) {
      const nextIndex = (currentIndex + 1) % filteredPhotos.length;
      const prevIndex = (currentIndex - 1 + filteredPhotos.length) % filteredPhotos.length;
      
      const imgNext = new Image();
      imgNext.src = filteredPhotos[nextIndex].src;
      
      const imgPrev = new Image();
      imgPrev.src = filteredPhotos[prevIndex].src;
    }
    // Mover con las flechas de la imagen principal
    function moveSlide(direction) {
      selectFeaturedPhoto(selectedPhotoIndex + direction);
    }
  
    // Mover con las flechas laterales del carrusel
    function scrollThumbs(direction) {
      thumbTrack.scrollBy({ left: direction * 250, behavior: 'smooth' });
    }
  
    /* ====================================
       FILTRADO POR CATEGORÍAS
    ==================================== */
    function filterCategory(category) {
      currentCategory = category;
  
      const filterBtns = document.querySelectorAll('.filter-btn');
      filterBtns.forEach(btn => {
        if (btn.innerText.toLowerCase() === category.toLowerCase()) {
          btn.classList.add('active-filter');
        } else {
          btn.classList.remove('active-filter');
        }
      });
  
      if (category === 'todas') {
        filteredPhotos = [...allPhotos];
      } else {
        filteredPhotos = allPhotos.filter(p => p.category === category);
      }
  
      selectedPhotoIndex = 0;
      renderThumbnails();
      selectFeaturedPhoto(0);
    }
  
    // Iniciar al cargar
    window.onload = initViewer;
  </script>
